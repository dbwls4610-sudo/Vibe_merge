<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제주 카페·맛집 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
  :root {
    --bg: #f6f3ee;
    --panel: #ffffff;
    --ink: #2b2a28;
    --muted: #7a756c;
    --line: #e6e0d6;
    --cafe: #d9782d;
    --food: #2a6fdb;
    --pick: #f2b01e;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;
  }
  header h1 { font-size: 1.15rem; margin: 0; }
  header h1 small { display: block; font-size: .78rem; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filters button {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    padding: 8px 16px; border-radius: 999px; font-size: .9rem; cursor: pointer;
    font-family: inherit; transition: background .15s, color .15s, border-color .15s;
  }
  .filters button:hover { border-color: var(--ink); }
  .filters button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .filters button .n { opacity: .65; margin-left: 4px; font-size: .8rem; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 340px; }
  .map-wrap { position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; }

  aside {
    background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  aside h2 { margin: 0; padding: 16px 18px 10px; font-size: 1rem; }
  aside h2 .star { color: var(--pick); }
  aside h2 .count { color: var(--muted); font-weight: 400; font-size: .85rem; margin-left: 4px; }
  #picks { list-style: none; margin: 0; padding: 0 10px 14px; overflow-y: auto; }
  #picks li { margin-bottom: 6px; }
  #picks button {
    width: 100%; text-align: left; border: 1px solid var(--line); background: #fff;
    border-radius: 10px; padding: 10px 12px; cursor: pointer; font-family: inherit; color: inherit;
  }
  #picks button:hover, #picks button.on { border-color: var(--ink); background: #faf8f4; }
  .pick-name { font-weight: 600; font-size: .92rem; }
  .pick-sub { font-size: .78rem; color: var(--muted); margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: var(--muted); font-size: .88rem; padding: 8px 12px; }

  .badge {
    display: inline-block; font-size: .72rem; font-weight: 600; color: #fff;
    padding: 2px 8px; border-radius: 999px; margin-right: 6px; vertical-align: 1px;
  }
  .badge.cafe { background: var(--cafe); }
  .badge.food { background: var(--food); }

  /* 지도 위 설명 카드 */
  #card {
    position: absolute; left: 16px; bottom: 16px; z-index: 1000;
    width: min(360px, calc(100% - 32px));
    background: var(--panel); border-radius: var(--radius);
    box-shadow: 0 10px 30px rgba(0,0,0,.22); padding: 18px 18px 16px;
    display: none;
  }
  #card.show { display: block; animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
  #card .close {
    position: absolute; top: 8px; right: 10px; border: 0; background: none;
    font-size: 1.4rem; line-height: 1; color: var(--muted); cursor: pointer;
  }
  #card h3 { margin: 6px 24px 6px 0; font-size: 1.1rem; }
  #card .addr { font-size: .82rem; color: var(--muted); margin: 0 0 10px; }
  #card .desc { font-size: .92rem; line-height: 1.55; margin: 0 0 12px; }
  #card .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: .8rem; }
  #card .foot a { color: var(--food); text-decoration: none; }
  #card .foot a:hover { text-decoration: underline; }
  .pickmark { color: #a87500; font-weight: 600; }

  /* 마커 */
  .pin {
    width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35);
    display: grid; place-items: center;
  }
  .pin span { transform: rotate(45deg); font-size: 14px; line-height: 1; }
  .pin.cafe { background: var(--cafe); }
  .pin.food { background: var(--food); }
  .pin.pick { box-shadow: 0 0 0 3px var(--pick), 0 2px 6px rgba(0,0,0,.35); }
  .leaflet-marker-icon.active .pin { transform: rotate(-45deg) scale(1.25); }

  #notice {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 1000;
    background: rgba(255,255,255,.95); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; font-size: .78rem; color: var(--muted); max-width: calc(100% - 24px);
    pointer-events: none;
  }
  #error {
    margin: 24px; padding: 16px 18px; background: #fff3f0; border: 1px solid #f0c4ba;
    border-radius: 10px; color: #8a2c17; line-height: 1.6;
  }

  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: 58vh auto; }
    body { height: auto; min-height: 100%; }
    html, body { height: auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    #picks { max-height: 320px; }
    #card { left: 10px; right: 10px; bottom: 10px; width: auto; }
  }
</style>
</head>
<body>
<header>
  <h1>제주 카페·맛집 지도<small id="sub"></small></h1>
  <div class="filters" id="filters" role="group" aria-label="카테고리 필터"></div>
</header>

<main>
  <div class="map-wrap">
    <div id="map"></div>
    <div id="notice">마커 위치는 읍·면·동 단위의 대략적인 위치예요</div>
    <article id="card" aria-live="polite">
      <button class="close" aria-label="카드 닫기">×</button>
      <span class="badge" id="c-badge"></span><span class="pickmark" id="c-pick"></span>
      <h3 id="c-name"></h3>
      <p class="addr" id="c-addr"></p>
      <p class="desc" id="c-desc"></p>
      <div class="foot"><a id="c-src" target="_blank" rel="noopener noreferrer">출처 보기 ↗</a>
        <a id="c-nav" target="_blank" rel="noopener noreferrer">지도에서 검색 ↗</a></div>
    </article>
  </div>
  <aside>
    <h2><span class="star">★</span> 추천 pick<span class="count" id="pick-count"></span></h2>
    <ul id="picks"></ul>
  </aside>
</main>

<script>
const DATA_URL = "jeju_cafe_restaurant.json";

// 주소에 들어 있는 동네·도로명으로 대략적인 좌표를 찾는 표 (위에 있을수록 우선)
const AREAS = [
  ["선흘리",[33.488,126.680]], ["조천읍",[33.544,126.669]],
  ["난산로",[33.400,126.870]], ["신풍하동로",[33.385,126.810]], ["온평",[33.409,126.904]],
  ["서성일로",[33.454,126.883]], ["성산읍",[33.460,126.921]],
  ["행원",[33.553,126.800]], ["구좌해안로",[33.558,126.755]], ["중산간동로",[33.470,126.790]],
  ["세화",[33.523,126.860]], ["면수",[33.500,126.800]], ["구좌읍",[33.520,126.860]],
  ["옹포",[33.410,126.260]], ["귀덕",[33.447,126.303]], ["금능",[33.392,126.235]],
  ["수원1길",[33.380,126.240]], ["한림로3길",[33.412,126.268]], ["한림상로",[33.394,126.240]],
  ["한림읍",[33.394,126.240]],
  ["한경해안로",[33.345,126.175]], ["불그못로",[33.330,126.210]], ["녹차분재로",[33.310,126.270]],
  ["저지",[33.320,126.257]], ["한경면",[33.340,126.190]],
  ["유수암로",[33.400,126.360]], ["가문동",[33.473,126.335]], ["일주서로",[33.460,126.305]],
  ["애월읍",[33.463,126.320]],
  ["신화역사로",[33.306,126.368]], ["산방로",[33.240,126.310]], ["사계",[33.230,126.315]],
  ["동광본동로",[33.300,126.390]], ["안덕면",[33.280,126.340]],
  ["무릉",[33.290,126.200]], ["보성구억로",[33.260,126.270]], ["하모항구로",[33.215,126.253]],
  ["최남단해안로",[33.215,126.253]], ["대정읍",[33.230,126.250]],
  ["녹산로",[33.370,126.700]], ["번영로 2610",[33.360,126.830]], ["돈오름로",[33.350,126.800]],
  ["표선면",[33.325,126.835]],
  ["칠십리로",[33.240,126.560]], ["이중섭로",[33.243,126.565]], ["중문관광로",[33.250,126.410]],
  ["천제연로",[33.255,126.417]], ["예래",[33.245,126.375]], ["이어도로",[33.265,126.510]],
  ["동홍로",[33.270,126.575]], ["태평로",[33.248,126.564]], ["중정로",[33.247,126.563]],
  ["명동로",[33.248,126.564]], ["소암로",[33.252,126.564]], ["김정문화로",[33.251,126.513]],
  ["항골남길",[33.489,126.495]], ["귀아랑길",[33.492,126.488]], ["제원길",[33.485,126.475]],
  ["진군",[33.493,126.487]], ["신대로",[33.490,126.488]], ["우평로",[33.488,126.488]],
  ["연오로",[33.491,126.493]], ["흥운길",[33.478,126.469]], ["서해안로",[33.498,126.470]],
  ["다호북길",[33.497,126.460]], ["테우해안로",[33.498,126.453]], ["한라대학로",[33.458,126.444]],
  ["1100로",[33.487,126.485]], ["오라로",[33.476,126.500]], ["용마서1길",[33.505,126.495]],
  ["용문로",[33.511,126.510]], ["성지로",[33.515,126.526]], ["동문로",[33.513,126.529]],
  ["북성로",[33.515,126.529]], ["건입동",[33.517,126.543]], ["번영로",[33.488,126.556]],
  ["서귀포시",[33.254,126.560]], ["제주시",[33.500,126.531]]
];

function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }

// 같은 동네에 마커가 겹치지 않도록 이름 기반으로 약간 흩뿌림
function locate(item) {
  const hit = AREAS.find(([k]) => item.address.includes(k));
  const [lat, lng] = hit ? hit[1] : [33.38, 126.55];
  const h = hash(item.name);
  const ang = (h % 360) * Math.PI / 180;
  const r = 0.0015 + (h % 7) * 0.0006;
  return [lat + Math.sin(ang) * r, lng + Math.cos(ang) * r * 1.2];
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cls = cat => cat === "카페" ? "cafe" : "food";
const icon = cat => cat === "카페" ? "☕" : "🍴";

const map = L.map("map", { zoomControl: true }).setView([33.38, 126.55], 10);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "© OpenStreetMap contributors"
}).addTo(map);
const cluster = L.markerClusterGroup({ maxClusterRadius: 45, showCoverageOnHover: false });
map.addLayer(cluster);

const card = document.getElementById("card");
let items = [], activeCat = "전체", activeMarker = null;

function showCard(it, marker) {
  if (activeMarker && activeMarker._icon) activeMarker._icon.classList.remove("active");
  activeMarker = marker;
  if (marker && marker._icon) marker._icon.classList.add("active");
  const b = document.getElementById("c-badge");
  b.textContent = it.category; b.className = "badge " + cls(it.category);
  document.getElementById("c-pick").textContent = it.selected ? "★ 추천 pick" : "";
  document.getElementById("c-name").textContent = it.name;
  document.getElementById("c-addr").textContent = it.address;
  document.getElementById("c-desc").textContent = it.description;
  const src = document.getElementById("c-src");
  src.href = it.source; src.style.display = it.source ? "" : "none";
  document.getElementById("c-nav").href =
    "https://map.kakao.com/?q=" + encodeURIComponent(it.name + " 제주");
  card.classList.add("show");
  document.querySelectorAll("#picks button").forEach(btn =>
    btn.classList.toggle("on", btn.dataset.name === it.name));
}
card.querySelector(".close").onclick = () => {
  card.classList.remove("show");
  if (activeMarker && activeMarker._icon) activeMarker._icon.classList.remove("active");
  activeMarker = null;
};

function render() {
  const list = items.filter(i => activeCat === "전체" || i.category === activeCat);
  cluster.clearLayers();
  card.classList.remove("show"); activeMarker = null;
  list.forEach(it => {
    const m = L.marker(it._pos, {
      title: it.name,
      icon: L.divIcon({
        className: "",
        html: `<div class="pin ${cls(it.category)}${it.selected ? " pick" : ""}"><span>${icon(it.category)}</span></div>`,
        iconSize: [30, 30], iconAnchor: [15, 30]
      })
    });
    m.on("click", () => showCard(it, m));
    it._marker = m;
    cluster.addLayer(m);
  });

  const picks = list.filter(i => i.selected);
  document.getElementById("pick-count").textContent = `(${picks.length})`;
  const ul = document.getElementById("picks");
  ul.innerHTML = picks.length ? "" : '<li class="empty">이 카테고리에는 추천 pick이 아직 없어요.</li>';
  picks.forEach(it => {
    const li = document.createElement("li");
    li.innerHTML = `<button data-name="${esc(it.name)}">
      <div class="pick-name"><span class="badge ${cls(it.category)}">${esc(it.category)}</span>${esc(it.name)}</div>
      <div class="pick-sub">${esc(it.description)}</div></button>`;
    li.querySelector("button").onclick = () => {
      map.setView(it._pos, 15);
      cluster.zoomToShowLayer(it._marker, () => showCard(it, it._marker));
    };
    ul.appendChild(li);
  });
}

function buildFilters() {
  const cats = ["전체", ...new Set(items.map(i => i.category))];
  const wrap = document.getElementById("filters");
  cats.forEach(c => {
    const n = c === "전체" ? items.length : items.filter(i => i.category === c).length;
    const b = document.createElement("button");
    b.innerHTML = `${c === "전체" ? "" : icon(c) + " "}${esc(c)}<span class="n">${n}</span>`;
    b.className = c === activeCat ? "active" : "";
    b.onclick = () => {
      activeCat = c;
      wrap.querySelectorAll("button").forEach(x => x.classList.toggle("active", x === b));
      render();
    };
    wrap.appendChild(b);
  });
}

// 서버로 열면 JSON을 읽고, 파일을 바로 열었을 때(file://)는 jeju_data.js로 대신 읽음
function loadData() {
  return fetch(DATA_URL)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .catch(() => new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "jeju_data.js";
      s.onload = () => resolve(window.JEJU_DATA);
      s.onerror = () => reject(new Error("jeju_cafe_restaurant.json / jeju_data.js 없음"));
      document.head.appendChild(s);
    }));
}

loadData()
  .then(data => {
    items = data.items.map(i => ({ ...i, _pos: locate(i) }));
    document.getElementById("sub").textContent = `${data.region} · ${items.length}곳`;
    buildFilters();
    render();
    map.fitBounds(L.latLngBounds(items.map(i => i._pos)).pad(0.1));
  })
  .catch(err => {
    document.querySelector("main").innerHTML =
      `<div id="error"><b>데이터를 불러오지 못했어요.</b><br>
      index.html과 같은 폴더에 jeju_cafe_restaurant.json, jeju_data.js가 있는지 확인해 주세요.<br>
      <small>(${esc(err.message)})</small></div>`;
  });
</script>
</body>
</html>
