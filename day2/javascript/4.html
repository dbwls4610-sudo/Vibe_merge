<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function plus(a, b){
            return a+b
        }

        function minus(a, b){      // fminus -> minus (이름을 호출하는 쪽과 맞춤)
            return a-b
        }
         function mul(a, b){
            return a*b
        }

        function div(a, b){
            return a/b
        }
         function mod(a, b){       // 두 번째 div -> mod (같은 이름이면 덮어써짐)
            return a%b
        }

        // click -> mouseover : 버튼 위에 마우스를 올리면 함수가 호출됨
        // console.plus(...) -> console.log(plus(...)) : 함수를 호출하고 결과를 콘솔에 출력
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelector('button#plus').addEventListener('mouseover', function () {
             console.log(plus(4, 6))
            });

            document.querySelector('button#minus').addEventListener('mouseover', function () {
                console.log(minus(4, 6))
            });

            document.querySelector('button#mul').addEventListener('mouseover', function () {
                console.log(mul(4, 6))
            });

            document.querySelector('button#div').addEventListener('mouseover', function () {
                console.log(div(4, 6))
            });

            document.querySelector('button#mod').addEventListener('mouseover', function () {
                console.log(mod(4, 6))
            });
        });
    </script>
</head>
<body>
    안녕하세요
    <h1>
        반갑습니다
    </h1>
    <h2>
        반갑습니다
    </h2>
    <button id="plus">덧셈</button>
    <button id="minus">뺄셈</button>
    <button id="mul">곱셈</button>
    <button id="div">나눗셈</button>
    <button id="mod">나머지</button>
</body>
</html>
