<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // 버튼 id, 화면에 보일 기호, 계산 함수(화살표 함수)를 한 곳에 모아 둠
        var operations = [
            { id: 'plus',  symbol: '+', fn: (a, b) => a + b },
            { id: 'minus', symbol: '-', fn: (a, b) => a - b },
            { id: 'mul',   symbol: 'x', fn: (a, b) => a * b },
            { id: 'div',   symbol: '÷', fn: (a, b) => a / b }
        ]

        document.addEventListener('DOMContentLoaded', function () {
            // 반복문으로 버튼마다 같은 방식의 클릭 이벤트를 연결
            operations.forEach(function (op) {
                document.querySelector('button#' + op.id).addEventListener('click', function () {
                    var a = Number(document.querySelector('input#a').value)
                    var b = Number(document.querySelector('input#b').value)
                    document.querySelector('h2#result').textContent = a + ' ' + op.symbol + ' ' + b + ' = ' + op.fn(a, b)
                });
            });
        });
    </script>
</head>
<body>
    안녕하세요
    <h1>
        반갑습니다
    </h1>
    <h2 id="result">
        결과가 여기에 표시됩니다
    </h2>
    <input id="a" type="number" placeholder="첫 번째 숫자">
    <input id="b" type="number" placeholder="두 번째 숫자">
    <button id="plus">덧셈</button>
    <button id="minus">뺄셈</button>
    <button id="mul">곱셈</button>
    <button id="div">나눗셈</button>
</body>
</html>
